name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set build timestamp
        run: echo "BUILD_TIME=$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Refresh sitemap lastmod for dynamic pages
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          python3 - "$TODAY" <<'PY'
          import re, sys, pathlib
          today = sys.argv[1]
          p = pathlib.Path("public/sitemap.xml")
          xml = p.read_text()
          for loc in ["https://amicosegreto.fun/", "https://amicosegreto.fun/regali"]:
              pattern = re.compile(
                  r"(<loc>" + re.escape(loc) + r"</loc>\s*<lastmod>)[^<]+(</lastmod>)"
              )
              xml = pattern.sub(r"\g<1>" + today + r"\g<2>", xml)
          p.write_text(xml)
          PY

      - name: Require Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Refusing to build: set Actions variable VITE_SUPABASE_URL and secret VITE_SUPABASE_PUBLISHABLE_KEY before merging."
            exit 1
          fi

      - name: Build application
        run: npm run build
        env:
          VITE_BUILD_TIME: ${{ env.BUILD_TIME }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_PUBLIC_BASE_URL: ${{ vars.VITE_PUBLIC_BASE_URL }}
          VITE_AUTH_REDIRECT_OVERRIDE: ${{ vars.VITE_AUTH_REDIRECT_OVERRIDE }}
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED }}
          VITE_ADSENSE_EDGE_LEFT_SLOT: ${{ secrets.ADSENSE_EDGE_LEFT_SLOT }}
          VITE_ADSENSE_EDGE_RIGHT_SLOT: ${{ secrets.ADSENSE_EDGE_RIGHT_SLOT }}
          VITE_ADSENSE_MOBILE_FEED_SLOT: ${{ secrets.ADSENSE_MOBILE_FEED_SLOT }}
          VITE_AMAZON_PARTNER_TAG: ${{ vars.VITE_AMAZON_PARTNER_TAG }}
          VITE_PINTEREST_TAG_ID: ${{ vars.VITE_PINTEREST_TAG_ID }}
          VITE_I18N_ENABLED: ${{ vars.VITE_I18N_ENABLED }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**

      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret not set — skipping IndexNow ping."
            exit 0
          fi
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"amicosegreto.fun\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"https://amicosegreto.fun/${INDEXNOW_KEY}.txt\",
              \"urlList\": [
                \"https://amicosegreto.fun/\",
                \"https://amicosegreto.fun/regali\",
                \"https://amicosegreto.fun/chi-siamo\",
                \"https://amicosegreto.fun/sitemap.xml\"
              ]
            }" || echo "IndexNow ping failed (non-blocking)"
